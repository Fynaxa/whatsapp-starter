[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-starter"
version = "1.0.0"
description = "A small, production-shaped starter for the WhatsApp Business Cloud API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["whatsapp_starter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
